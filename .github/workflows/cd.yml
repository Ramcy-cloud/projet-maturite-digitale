# CD (livraison continue) : rien n'est livré sans validation manuelle.
# Workflows réutilisables : https://github.com/Ramcy-cloud/ci-templates
#
# Dépôt public → validation par environnement GitHub. L'environnement
# « production » doit avoir un « required reviewer » :
#   Settings → Environments → production → Required reviewers.
# La livraison démarre quand la CI est verte sur main, puis attend :
#   Actions → exécution « CD » → Review deployments → Approve.
#
# Projet sans Dockerfile : on republie les artefacts « build-* » produits par la
# CI (les données calculées), et non une image sur ghcr.io.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  livraison:
    name: Livraison
    # Ne livrer qu'après une CI verte déclenchée par un push sur main : une CI
    # verte sur une pull request ne doit rien livrer.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      actions: read
    uses: Ramcy-cloud/ci-templates/.github/workflows/artifact-delivery.yml@v1
    with:
      environment: production
      pattern: build-*
      # Les artefacts viennent d'une AUTRE exécution (celle de la CI).
      run-id: ${{ github.event.workflow_run.id }}
      sha: ${{ github.event.workflow_run.head_sha }}
